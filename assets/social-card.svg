  <linearGradient id="glass-frost" x2=".8" y2="1"><stop stop-color="#fff" stop-opacity=".84"/><stop offset=".52" stop-color="#fff" stop-opacity=".59"/><stop offset="1" stop-color="#edf6ff" stop-opacity=".73"/></linearGradient>
