            npm_runtime: requireRun(34257459736, "d54c9bfb1b580660e47fce78f5d653841beada88"),
          };
          const jobs = api("repos/" + REPO + "/actions/runs/" + runs.native.id + "/jobs?per_page=100").jobs;
          assert.equal(jobs.length, 7);
          assert(jobs.every(job => job.status === "completed" && job.conclusion === "success"));
          for (const expected of ARCHIVES) {
