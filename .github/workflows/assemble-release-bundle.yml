          function validateArchiveEvidence(evidence, expected) {
            function requireValue(condition, message) {
              if (!condition) throw new Error("Invalid archive evidence: " + message);
            }
            requireValue(evidence?.source_sha === expected.sourceSha, "source revision differs");
            requireValue(evidence.target === expected.target && evidence.asset === expected.asset, "target or filename differs");
            requireValue(evidence.version === "turbotokens 1.1.3", "binary version differs");
            requireValue(evidence.rustc === "rustc 1.97.1 (8bab26f4f 2026-07-14)", "compiler differs");
            requireValue(/^[0-9a-f]{64}$/.test(evidence.archive_sha256 || ""), "archive hash is missing");
            requireValue(/^[0-9a-f]{64}$/.test(evidence.binary_sha256 || ""), "binary hash is missing");
            requireValue(Number.isSafeInteger(evidence.archive_bytes) && evidence.archive_bytes > 0, "invalid archive size");
            const binary = expected.asset.endsWith(".zip") ? "turbotokens.exe" : "turbotokens";
            requireValue(Array.isArray(evidence.members) && JSON.stringify([...evidence.members].sort()) === JSON.stringify(["LICENSE", "README.md", binary].sort()), "archive members differ");
            requireValue(evidence.pricing?.sha256 === expected.pricing.sha256 &&
              evidence.pricing?.source_commit === expected.pricing.source_commit &&
              evidence.pricing?.url === expected.pricing.url &&
              evidence.pricing?.bytes === expected.pricing.bytes, "pricing input differs");
            return evidence;
          }
          
          const sha256 = bytes => createHash("sha256").update(bytes).digest("hex");
          const api = route => JSON.parse(execFileSync("gh", ["api", route], { encoding: "utf8", maxBuffer: 8 * 1024 * 1024 }));
