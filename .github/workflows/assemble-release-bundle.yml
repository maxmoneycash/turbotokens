                                evidence_sha256:sha256(files[filename])});
            }
            const auditFiles = unpack(AUDIT_ARTIFACT, ["rustsec-report.json", "source-revision.txt", "lockfile-sha256.txt", "advisory-db-revision.txt"]);
            const audit = JSON.parse(auditFiles["rustsec-report.json"]);
            assert.equal(audit.vulnerabilities.found, false);
            assert.equal(audit.vulnerabilities.count, 0);
            assert.deepEqual(audit.vulnerabilities.list, []);
            assert.deepEqual(audit.warnings, {});
            assert.deepEqual(audit.settings.ignore, []);
            assert.deepEqual(audit.settings.target_arch, []);
            assert.deepEqual(audit.settings.target_os, []);
            assert.equal(audit.lockfile["dependency-count"], 147);
            assert.equal(audit.database["last-commit"], auditFiles["advisory-db-revision.txt"].toString().trim());
            const lockfileHash = sha256(fs.readFileSync("rust/Cargo.lock"));
            assert.equal(auditFiles["lockfile-sha256.txt"].toString().split(/\s+/)[0], lockfileHash);
            const fullTests = unpack(TESTS_ARTIFACT, ["full-workspace-tests.log"])["full-workspace-tests.log"];
            const counts = { passed: 0, failed: 0, ignored: 0, measured: 0, filtered: 0, suites: 0 };
            for (const line of fullTests.toString().split("\n")) {
              const match = line.match(/test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out/);
              if (match) {
                for (const [index, name] of ["passed", "failed", "ignored", "measured", "filtered"].entries()) counts[name] += Number(match[index + 1]);
                counts.suites++;
              }
            }
            assert.deepEqual(counts, { passed: 772, failed: 0, ignored: 3, measured: 0, filtered: 0, suites: 54 });
            const harness = fs.readFileSync("rust/bench/stress-claude.py", "utf8").replace(/\r\n/g, "\n");
            const provenance = {
              source_sha: SOURCE, version: "1.1.3", inputs, runs,
              assembled_at: new Date().toISOString(), assembler_run_id: Number(process.env.GITHUB_RUN_ID),
              archives: checked, native_smoke_checks: nativeChecks, svg_fix: { pull_request: 19, source_sha: "fe77dabc24f89019cdbebf362fe46ddb27b9b5fb", baseline_run: 34261013151, validation_run: 34260785813 }, artifact_records: [...ARTIFACTS, AUDIT_ARTIFACT, TESTS_ARTIFACT],
              full_tests: { ...counts, log_sha256: sha256(fullTests) },
              dependency_audit: audit, dependency_audit_source_sha: auditFiles["source-revision.txt"].toString().trim(), lockfile_sha256: lockfileHash,
              reviewed_harness_hashes: { lf: sha256(harness), crlf: sha256(harness.replace(/\n/g, "\r\n")) },
              soak_requirement: { run_id: 34234896673, head_sha: "7ed32daf71d91d0ea4fb136ba66b09a083e8171d", source_sha: "822b236b3900294276bac9c5d19ba28b4c0b2530", duration_seconds: 18000, report_cache_limit: 256 },
              scope: "Fresh native archives and their shared pricing input passed native smoke and archive checks. The separate five-hour soak covers unchanged Claude report/cache code with recorded-cost fixtures and must pass before publication. Only SVG label escaping and its unit tests differ from that soak source; the final binaries passed their own SVG, native report, cache, and live-update checks.",
            };
            fs.writeFileSync(path.join(output, "BUILD_PROVENANCE.json"), JSON.stringify(provenance, null, 2) + "\n");
            fs.writeFileSync(path.join(output, "SHA256SUMS"), [...checked].sort((a, b) => a.asset.localeCompare(b.asset)).map(item => item.archive_sha256 + "  " + item.asset).join("\n") + "\n");
            console.log(JSON.stringify({ source_sha: SOURCE, archives: checked.length, full_tests: counts, known_vulnerabilities: audit.vulnerabilities.count, pricing_sha256: PRICING.sha256 }));
          } finally {
            fs.rmSync(temporary, { recursive: true, force: true });
          }
          
          NODE
      - name: Independently verify each packaged executable and guide
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, stat, tarfile, zipfile
          from pathlib import Path
          root = Path("release-bundle")
          provenance = json.loads((root / "BUILD_PROVENANCE.json").read_text())
          expected_source = "27ceda8944e85429ddd8e62e650c7994459a9568"
          assert provenance["source_sha"] == expected_source
          license_text = Path("LICENSE").read_text().replace("\r\n", "\n")
          for item in provenance["archives"]:
              archive_path = root / item["asset"]
              binary = "turbotokens.exe" if item["asset"].endswith(".zip") else "turbotokens"
              expected = {binary, "README.md", "LICENSE"}
              assert archive_path.stat().st_size == item["archive_bytes"]
              assert hashlib.sha256(archive_path.read_bytes()).hexdigest() == item["archive_sha256"]
              if item["asset"].endswith(".zip"):
                  with zipfile.ZipFile(archive_path) as archive:
                      entries = archive.infolist()
                      assert len(entries) == 3 and {entry.filename for entry in entries} == expected
                      assert all(not entry.is_dir() and entry.file_size <= 64 * 1024 * 1024 for entry in entries)
                      assert all(stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG) for entry in entries)
                      contents = {name: archive.read(name) for name in expected}
              else:
                  with tarfile.open(archive_path, "r:gz") as archive:
                      entries = archive.getmembers()
                      assert len(entries) == 3 and {entry.name for entry in entries} == expected
                      assert all(entry.isfile() and entry.size <= 64 * 1024 * 1024 for entry in entries)
                      assert archive.getmember(binary).mode & 0o111
                      contents = {name: archive.extractfile(name).read() for name in expected}
              assert hashlib.sha256(contents[binary]).hexdigest() == item["binary_sha256"]
              assert contents["LICENSE"].decode("utf-8-sig").replace("\r\n", "\n") == license_text
              readme = contents["README.md"].decode("utf-8-sig")
              assert "@REVISION@" not in readme
              for guide in ["README.md", "docs/installation.md", "docs/migrating-from-ccusage.md", "docs/usage.md"]:
                  assert "https://github.com/maxmoneycash/turbotokens/blob/" + expected_source + "/" + guide in readme
              print("Archive contents verified:", item["asset"])
          files = {path.name for path in root.iterdir()}
          assert files == {item["asset"] for item in provenance["archives"]} | {"SHA256SUMS", "BUILD_PROVENANCE.json"}
          print("Bundle verified:", len(provenance["archives"]), "native archives")
          
          PY
          cd release-bundle
          sha256sum --check SHA256SUMS
      - name: Keep the verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-v1.1.3
          path: release-bundle/*
          if-no-files-found: error
