name: Assemble verified native v1.1.3 bundle

on:
  push:
    branches: [validation/release-bundle-v1.1.3]

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5a71c3e01215601901fc4c38f4cb2133674b542
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source matches the reviewed checks
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c5a71c3e01215601901fc4c38f4cb2133674b542
          git diff --exit-code 822b236b3900294276bac9c5d19ba28b4c0b2530 HEAD -- rust rust-toolchain.toml .cargo .gitattributes packaging/smoke-native.py packaging/smoke-linux.py packaging/RELEASE_README.md
          git diff --exit-code b539d72974ee8e99faf4aa0d13cfe383e1c68404 HEAD -- npm/install.js npm/bin/turbotokens.js npm/test/launcher.test.cjs packaging/smoke-npm.cjs
          git diff --exit-code c4960f34a14a945e5e4c5238b29842c76070e9e4 HEAD -- rust/Cargo.lock
      - name: Download immutable artifacts and verify evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          "use strict";
          const assert = require("node:assert/strict");
          const { execFileSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const os = require("node:os");
          const REPO = "maxmoneycash/turbotokens";
