                {case:"controls", xml_parsed:true, json_name_preserved:true},
                {case:"unicode", xml_parsed:true, json_name_preserved:true}
              ]);
              assert.equal(report.checks.stress_claude.evidence.status, "passed");
              assert.equal(report.checks.stress_claude.evidence.steps_completed, 32);
              nativeChecks.push({target:expected.target, binary_sha256:report.sha256,
