riAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"},"rustc":"rustc 1.97.1 (8bab26f4f 2026-07-14)","source_sha":"27ceda8944e85429ddd8e62e650c7994459a9568","target":"x86_64-unknown-linux-musl","version":"turbotokens 1.1.3"},{"archive_bytes":3335301,"archive_sha256":"7256ba213586a8a37512b3dee112a63c868accd4af9166883ced8c74f4b924fe","asset":"turbotokens-linux-arm64.tar.gz","binary_sha256":"10a8f04e9f1863e5754821b9c02daba129ca66ceac79717932cb4d064c9620e0","members":["LICENSE","README.md","turbotokens"],"pricing":{"bytes":2311609,"sha256":"f68d88c12610ea31ab355a1293fde55aeed6fa78a1f4b182c67be47d80b1d202","source_commit":"eeb7732fc11fd47762ca84cc3fb7cc74235d7097","url":"https://raw.githubusercontent.com/BerriAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"},"rustc":"rustc 1.97.1 (8bab26f4f 2026-07-14)","source_sha":"27ceda8944e85429ddd8e62e650c7994459a9568","target":"aarch64-unknown-linux-musl","version":"turbotokens 1.1.3"},{"archive_bytes":3206887,"archive_sha256":"a12a578e9e7bd9955e0df95693d2d772a8774f399008694ed0da083e76950d85","asset":"turbotokens-windows-x64.zip","binary_sha256":"fa47942edfdcf20eadad85ba87bcffc67e0ff721f097455424e1aeb9cbad73c4","members":["LICENSE","README.md","turbotokens.exe"],"pricing":{"bytes":2311609,"sha256":"f68d88c12610ea31ab355a1293fde55aeed6fa78a1f4b182c67be47d80b1d202","source_commit":"eeb7732fc11fd47762ca84cc3fb7cc74235d7097","url":"https://raw.githubusercontent.com/BerriAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"},"rustc":"rustc 1.97.1 (8bab26f4f 2026-07-14)","source_sha":"27ceda8944e85429ddd8e62e650c7994459a9568","target":"x86_64-pc-windows-msvc","version":"turbotokens 1.1.3"},{"archive_bytes":2854053,"archive_sha256":"c4cbf294acea7cd3e392f0bbb490ed31baa912a3535077d38dc960f4afd7415b","asset":"turbotokens-windows-arm64.zip","binary_sha256":"4aa17f95bb19db37603234e3964ca97ce8015ae50a5dc3e24b84524c32fdcc1a","members":["LICENSE","README.md","turbotokens.exe"],"pricing":{"bytes":2311609,"sha256":"f68d88c12610ea31ab355a1293fde55aeed6fa78a1f4b182c67be47d80b1d202","source_commit":"eeb7732fc11fd47762ca84cc3fb7cc74235d7097","url":"https://raw.githubusercontent.com/BerriAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"},"rustc":"rustc 1.97.1 (8bab26f4f 2026-07-14)","source_sha":"27ceda8944e85429ddd8e62e650c7994459a9568","target":"aarch64-pc-windows-msvc","version":"turbotokens 1.1.3"}];
          const PRICING = {"bytes":2311609,"sha256":"f68d88c12610ea31ab355a1293fde55aeed6fa78a1f4b182c67be47d80b1d202","source_commit":"eeb7732fc11fd47762ca84cc3fb7cc74235d7097","url":"https://raw.githubusercontent.com/BerriAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"};
          const BUNDLE = {"id":10070769535,"name":"release-bundle-v1.1.3","size_in_bytes":19427577,"url":"https://api.github.com/repos/maxmoneycash/turbotokens/actions/artifacts/10070769535","archive_download_url":"https://api.github.com/repos/maxmoneycash/turbotokens/actions/artifacts/10070769535/zip","expired":false,"created_at":"2026-09-08T18:29:35Z","expires_at":"2026-12-07T18:29:06Z","updated_at":"2026-09-08T18:29:35Z","digest":"sha256:0deb035a1b55b13618fd2ffa97ae0491c25fc12837aff4f0f8b4df0fe612ed0b","workflow_run":{"id":34263301850,"repository_id":1315391958,"head_repository_id":1315391958,"head_branch":"validation/release-bundle-v1.1.3-r2","head_sha":"e3275a5c86c72ae49716856003ca49d21f597161"}};
          function validateSoakReport(report, expected) {
            function requireValue(condition, message) {
              if (!condition) throw new Error("Invalid soak evidence: " + message);
            }
            const integer = value => Number.isSafeInteger(value) && value >= 0;
            const operations = ["append", "append_whitespace", "partial_completion", "rewrite_same_size", "rewrite_larger", "truncate", "delete_restore", "duplicate_across_files"];
            requireValue(report && typeof report === "object", "report is missing");
            requireValue(report.status === "passed", "run did not pass");
            requireValue(report.seed === 20260908, "unexpected seed");
            requireValue(Number.isFinite(report.duration_seconds) && report.duration_seconds >= 18000, "requested duration is under five hours");
            requireValue(Number.isFinite(report.elapsed_seconds) && report.elapsed_seconds >= report.duration_seconds, "elapsed duration is incomplete");
            requireValue(integer(report.steps_completed) && report.steps_completed >= operations.length, "too few completed mutations");
            requireValue(report.current_step === report.steps_completed, "a mutation was left incomplete");
            requireValue(integer(report.checkpoints_passed) && report.checkpoints_passed >= report.steps_completed + 2, "missing checkpoints");
            requireValue(integer(report.child_processes) && report.child_processes >= 3 * report.checkpoints_passed, "missing cached/warm/uncached report executions");
            requireValue(expected.harnessHashes.includes(report.harness_sha256), "harness does not match reviewed source");
            requireValue(report.binary?.version === "turbotokens 1.1.3", "unexpected binary version");
            requireValue(/^[0-9a-f]{64}$/.test(report.binary?.sha256 || ""), "binary hash is missing");
            requireValue(typeof report.binary?.path === "string" && report.binary.path.replaceAll("\\", "/").includes("/target/" + expected.target + "/release/"), "artifact target does not match binary path");
            requireValue(report.max_report_cache_files === 256, "cache bound was not enabled");
            const cache = report.report_cache;
            requireValue(cache && integer(cache.files) && cache.files <= 256, "final cache exceeds the bound");
            requireValue(integer(cache.peak_sampled_files) && cache.peak_sampled_files >= cache.files && cache.peak_sampled_files <= 256, "sampled cache exceeds the bound");
            requireValue(integer(cache.bytes), "invalid cache byte count");
            requireValue(report.operations && typeof report.operations === "object" && !Array.isArray(report.operations), "operation counts are missing");
            for (const operation of operations) {
              requireValue(integer(report.operations[operation]) && report.operations[operation] > 0, "operation was not exercised: " + operation);
            }
            requireValue(operations.reduce((sum, operation) => sum + report.operations[operation], 0) === report.steps_completed, "operation counts do not match completed mutations");
            requireValue(Object.keys(report.operations).every(operation => operations.includes(operation) || operation === "capacity_truncate"), "unrecognized operation");
            if ("capacity_truncate" in report.operations) requireValue(integer(report.operations.capacity_truncate), "invalid capacity truncation count");
