name: Publish verified native v1.1.3

on:
  push:
    branches: [validation/publish-native-v1.1.3]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-native-v1.1.3
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 27ceda8944e85429ddd8e62e650c7994459a9568
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source matches the reviewed checks
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "27ceda8944e85429ddd8e62e650c7994459a9568"
          git diff --exit-code fe77dabc24f89019cdbebf362fe46ddb27b9b5fb HEAD -- rust rust-toolchain.toml .cargo .gitattributes packaging/smoke-native.py packaging/smoke-linux.py packaging/RELEASE_README.md
          git diff --exit-code d54c9bfb1b580660e47fce78f5d653841beada88 HEAD -- npm/install.js npm/bin/turbotokens.js npm/test/launcher.test.cjs packaging/smoke-npm.cjs
          git diff --exit-code c4960f34a14a945e5e4c5238b29842c76070e9e4 HEAD -- rust/Cargo.lock
          python3 - <<'PY'
          import json, subprocess
          base = "822b236b3900294276bac9c5d19ba28b4c0b2530"
          visual = "rust/crates/turbotokens/src/commands/visual.rs"
          wrapped = "rust/crates/turbotokens/src/commands/wrapped.rs"
          changed = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD", "--", "rust"], text=True).splitlines()
          assert sorted(changed) == sorted([visual, wrapped]), changed
          def source(revision, path):
              return subprocess.check_output(["git", "show", revision + ":" + path], text=True)
          assert source(base, wrapped).split("#[cfg(test)]", 1)[0] == source("HEAD", wrapped).split("#[cfg(test)]", 1)[0]
          before = source(base, visual).split("/// Escapes the five XML special characters", 1)[0]
          after = source("HEAD", visual).split("/// Escapes SVG text and replaces characters", 1)[0]
          assert before == after
          print(json.dumps({"soak_source": base, "release_source": "27ceda8944e85429ddd8e62e650c7994459a9568", "rust_changes": changed,
                            "scope": "Only SVG label escaping and its unit tests differ; report/cache code and the stress harness are unchanged."}))
          PY
      - name: Verify the release bundle and completed five-hour evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          "use strict";
          const assert = require("node:assert/strict");
          const {execFileSync} = require("node:child_process");
