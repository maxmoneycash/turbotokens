              "- [Native checks](https://github.com/" + REPO + "/actions/runs/" + runs.native.id + "): all six targets passed with one pinned pricing snapshot.",
              "- [Five-hour stress tests](https://github.com/" + REPO + "/actions/runs/" + runs.soak.id + "): six targets, " + totalSteps.toLocaleString("en-US") + " synthetic log mutations and " + totalChecks.toLocaleString("en-US") + " cached/warm/uncached comparisons in total.",
              "- [RustSec audit](https://github.com/" + REPO + "/actions/runs/" + runs.audit.id + "): 147 dependencies checked, no known vulnerabilities or warnings in the recorded database snapshot.",
              "",
              "The stress tests cover unchanged recorded-cost Claude daily report/cache code. Only SVG label escaping and its tests differ from that soak source. The release binaries have a separately pinned pricing snapshot and their own native smoke checks. See the attached BUILD_PROVENANCE.json and VALIDATION.json for hashes and scope.",
              "",
              "## Install",
              "",
              "Choose the archive for your operating system and CPU. [macOS, Windows, and Linux instructions](https://github.com/" + REPO + "/blob/" + SOURCE + "/docs/installation.md) include verification, PATH setup, and your first report.",
              "",
              "The native downloads here are v1.1.3. npm and Homebrew remain at v1.1.2 until their separate updates are published.",
              "",
              "[Migrating from ccusage](https://github.com/" + REPO + "/blob/" + SOURCE + "/docs/migrating-from-ccusage.md) · [Show your usage cards](https://github.com/" + REPO + "/discussions/6)",
              ""
            ].join("\n");
            fs.writeFileSync(path.join(output, "RELEASE_NOTES.md"), notes);
            console.log(JSON.stringify({status:"passed", source_sha:SOURCE, targets:soaks.length, mutations:totalSteps, comparisons:totalChecks}));
          } finally {
            fs.rmSync(temporary, {recursive:true, force:true});
          }
          
          NODE
      - name: Independently verify the native archive contents
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib, json, stat, tarfile, zipfile
          from pathlib import Path
          root = Path("approved-release")
          provenance = json.loads((root / "BUILD_PROVENANCE.json").read_text())
          expected_source = "27ceda8944e85429ddd8e62e650c7994459a9568"
          assert provenance["source_sha"] == expected_source
          license_text = Path("LICENSE").read_text().replace("\r\n", "\n")
          for item in provenance["archives"]:
              archive_path = root / item["asset"]
              binary = "turbotokens.exe" if item["asset"].endswith(".zip") else "turbotokens"
              expected = {binary, "README.md", "LICENSE"}
              assert archive_path.stat().st_size == item["archive_bytes"]
              assert hashlib.sha256(archive_path.read_bytes()).hexdigest() == item["archive_sha256"]
              if item["asset"].endswith(".zip"):
                  with zipfile.ZipFile(archive_path) as archive:
                      entries = archive.infolist()
                      assert len(entries) == 3 and {entry.filename for entry in entries} == expected
                      assert all(not entry.is_dir() and entry.file_size <= 64 * 1024 * 1024 for entry in entries)
                      assert all(stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG) for entry in entries)
                      contents = {name: archive.read(name) for name in expected}
              else:
                  with tarfile.open(archive_path, "r:gz") as archive:
                      entries = archive.getmembers()
                      assert len(entries) == 3 and {entry.name for entry in entries} == expected
                      assert all(entry.isfile() and entry.size <= 64 * 1024 * 1024 for entry in entries)
                      assert archive.getmember(binary).mode & 0o111
                      contents = {name: archive.extractfile(name).read() for name in expected}
              assert hashlib.sha256(contents[binary]).hexdigest() == item["binary_sha256"]
              assert contents["LICENSE"].decode("utf-8-sig").replace("\r\n", "\n") == license_text
              readme = contents["README.md"].decode("utf-8-sig")
              assert "@REVISION@" not in readme
              for guide in ["README.md", "docs/installation.md", "docs/migrating-from-ccusage.md", "docs/usage.md"]:
                  assert "https://github.com/maxmoneycash/turbotokens/blob/" + expected_source + "/" + guide in readme
              print("Archive contents verified:", item["asset"])
          files = {path.name for path in root.iterdir()}
          assert files == {item["asset"] for item in provenance["archives"]} | {"SHA256SUMS", "BUILD_PROVENANCE.json", "VALIDATION.json", "RELEASE_NOTES.md"}
          print("Bundle verified:", len(provenance["archives"]), "native archives")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: approved-native-release-v1.1.3
          path: approved-release/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: approved-native-release-v1.1.3
          path: approved-release
      - name: Create a draft, verify uploaded bytes, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          "use strict";
          const assert = require("node:assert/strict");
          const {execFileSync, spawnSync} = require("node:child_process");
          const {createHash} = require("node:crypto");
          const fs = require("node:fs"), path = require("node:path");
          const REPO = "maxmoneycash/turbotokens", SOURCE = "27ceda8944e85429ddd8e62e650c7994459a9568", TAG = "v1.1.3";
          const ARCHIVES = [{"archive_bytes":3034995,"archive_sha256":"e0ebdb307c70edb437ea23e98c2579b6747eefe03726174ce11f69f779768659","asset":"turbotokens-macos-arm64.tar.gz","binary_sha256":"77a43ff678097232e8868e1f9d92f8d3b602ee511cd0dc4c2d21ef36828f86bd","members":["LICENSE","README.md","turbotokens"],"pricing":{"bytes":2311609,"sha256":"f68d88c12610ea31ab355a1293fde55aeed6fa78a1f4b182c67be47d80b1d202","source_commit":"eeb7732fc11fd47762ca84cc3fb7cc74235d7097","url":"https://raw.githubusercontent.com/BerriAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"},"rustc":"rustc 1.97.1 (8bab26f4f 2026-07-14)","source_sha":"27ceda8944e85429ddd8e62e650c7994459a9568","target":"aarch64-apple-darwin","version":"turbotokens 1.1.3"},{"archive_bytes":3379632,"archive_sha256":"517cd526ee149e00e1ca6d29069cac0414e868f3202070b11c1717c619bbc811","asset":"turbotokens-macos-x64.tar.gz","binary_sha256":"19b962ae4d7649d90003473eafcc4c79d8792e6fd28ae80d23c5e3f27b1e1425","members":["LICENSE","README.md","turbotokens"],"pricing":{"bytes":2311609,"sha256":"f68d88c12610ea31ab355a1293fde55aeed6fa78a1f4b182c67be47d80b1d202","source_commit":"eeb7732fc11fd47762ca84cc3fb7cc74235d7097","url":"https://raw.githubusercontent.com/BerriAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"},"rustc":"rustc 1.97.1 (8bab26f4f 2026-07-14)","source_sha":"27ceda8944e85429ddd8e62e650c7994459a9568","target":"x86_64-apple-darwin","version":"turbotokens 1.1.3"},{"archive_bytes":3613841,"archive_sha256":"3e024cbbd916e037d5073149a92843960e2871ab8a5d5270ce90d593235f25a3","asset":"turbotokens-linux-x64.tar.gz","binary_sha256":"d0825e2a10aa5a0dec17bcd1126c247d42fa37fa80e466739026af9a822f687c","members":["LICENSE","README.md","turbotokens"],"pricing":{"bytes":2311609,"sha256":"f68d88c12610ea31ab355a1293fde55aeed6fa78a1f4b182c67be47d80b1d202","source_commit":"eeb7732fc11fd47762ca84cc3fb7cc74235d7097","url":"https://raw.githubusercontent.com/BerriAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"},"rustc":"rustc 1.97.1 (8bab26f4f 2026-07-14)","source_sha":"27ceda8944e85429ddd8e62e650c7994459a9568","target":"x86_64-unknown-linux-musl","version":"turbotokens 1.1.3"},{"archive_bytes":3335301,"archive_sha256":"7256ba213586a8a37512b3dee112a63c868accd4af9166883ced8c74f4b924fe","asset":"turbotokens-linux-arm64.tar.gz","binary_sha256":"10a8f04e9f1863e5754821b9c02daba129ca66ceac79717932cb4d064c9620e0","members":["LICENSE","README.md","turbotokens"],"pricing":{"bytes":2311609,"sha256":"f68d88c12610ea31ab355a1293fde55aeed6fa78a1f4b182c67be47d80b1d202","source_commit":"eeb7732fc11fd47762ca84cc3fb7cc74235d7097","url":"https://raw.githubusercontent.com/BerriAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"},"rustc":"rustc 1.97.1 (8bab26f4f 2026-07-14)","source_sha":"27ceda8944e85429ddd8e62e650c7994459a9568","target":"aarch64-unknown-linux-musl","version":"turbotokens 1.1.3"},{"archive_bytes":3206887,"archive_sha256":"a12a578e9e7bd9955e0df95693d2d772a8774f399008694ed0da083e76950d85","asset":"turbotokens-windows-x64.zip","binary_sha256":"fa47942edfdcf20eadad85ba87bcffc67e0ff721f097455424e1aeb9cbad73c4","members":["LICENSE","README.md","turbotokens.exe"],"pricing":{"bytes":2311609,"sha256":"f68d88c12610ea31ab355a1293fde55aeed6fa78a1f4b182c67be47d80b1d202","source_commit":"eeb7732fc11fd47762ca84cc3fb7cc74235d7097","url":"https://raw.githubusercontent.com/BerriAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"},"rustc":"rustc 1.97.1 (8bab26f4f 2026-07-14)","source_sha":"27ceda8944e85429ddd8e62e650c7994459a9568","target":"x86_64-pc-windows-msvc","version":"turbotokens 1.1.3"},{"archive_bytes":2854053,"archive_sha256":"c4cbf294acea7cd3e392f0bbb490ed31baa912a3535077d38dc960f4afd7415b","asset":"turbotokens-windows-arm64.zip","binary_sha256":"4aa17f95bb19db37603234e3964ca97ce8015ae50a5dc3e24b84524c32fdcc1a","members":["LICENSE","README.md","turbotokens.exe"],"pricing":{"bytes":2311609,"sha256":"f68d88c12610ea31ab355a1293fde55aeed6fa78a1f4b182c67be47d80b1d202","source_commit":"eeb7732fc11fd47762ca84cc3fb7cc74235d7097","url":"https://raw.githubusercontent.com/BerriAI/litellm/eeb7732fc11fd47762ca84cc3fb7cc74235d7097/model_prices_and_context_window.json"},"rustc":"rustc 1.97.1 (8bab26f4f 2026-07-14)","source_sha":"27ceda8944e85429ddd8e62e650c7994459a9568","target":"aarch64-pc-windows-msvc","version":"turbotokens 1.1.3"}];
          const directory = path.resolve("approved-release");
          const names = ARCHIVES.map(item => item.asset).concat(["SHA256SUMS", "BUILD_PROVENANCE.json", "VALIDATION.json"]);
          assert.deepEqual(fs.readdirSync(directory).sort(), [...names, "RELEASE_NOTES.md"].sort());
          const sha256 = data => createHash("sha256").update(data).digest("hex");
          const api = (route, body) => JSON.parse(execFileSync("gh", ["api", route, ...(body ? ["--method", "POST", "--input", "-"] : [])], {input:body ? JSON.stringify(body) : undefined, encoding:"utf8", maxBuffer:4*1024*1024}));
          function optional(route) {
            const result = spawnSync("gh", ["api", route], {encoding:"utf8", maxBuffer:4*1024*1024});
            if (result.error) throw result.error;
            if (result.status === 0) return JSON.parse(result.stdout);
            if (result.status === 1 && /\(HTTP 404\)/.test(result.stderr)) return null;
            throw new Error("GitHub lookup failed: " + result.stderr);
          }
          const provenance = JSON.parse(fs.readFileSync(path.join(directory, "BUILD_PROVENANCE.json")));
          const validation = JSON.parse(fs.readFileSync(path.join(directory, "VALIDATION.json")));
          assert.equal(provenance.source_sha, SOURCE);
          assert.deepEqual(provenance.archives, ARCHIVES);
          assert.equal(validation.source_sha, SOURCE);
          assert.equal(validation.status, "passed");
          assert.equal(validation.version, "1.1.3");
          assert.equal(validation.verification_run_id, Number(process.env.GITHUB_RUN_ID));
          assert.equal(validation.runs.soak.id, 34234896673);
          assert.equal(validation.soaks.length, 6);
          assert.deepEqual(validation.soaks.map(item => item.summary.target).sort(), ARCHIVES.map(item => item.target).sort());
          for (const item of validation.soaks) {
            assert.equal(item.summary.status, "passed");
            assert(item.summary.duration_seconds >= 18000 && item.summary.elapsed_seconds >= 18000);
            assert(item.summary.report_cache.files <= 256 && item.summary.report_cache.peak_sampled_files <= 256);
          }
          const sums = [...ARCHIVES].sort((a,b) => a.asset.localeCompare(b.asset)).map(item => item.archive_sha256 + "  " + item.asset).join("\n") + "\n";
          assert.equal(fs.readFileSync(path.join(directory, "SHA256SUMS"), "utf8"), sums);
          const expected = names.map(name => {
            const bytes = fs.readFileSync(path.join(directory, name));
            const archive = ARCHIVES.find(item => item.asset === name);
            if (archive) {
              assert.equal(bytes.length, archive.archive_bytes);
              assert.equal(sha256(bytes), archive.archive_sha256);
            }
            return {name, bytes:bytes.length, sha256:sha256(bytes)};
          });
          assert.equal(optional("repos/" + REPO + "/releases/tags/" + TAG), null, "A release already exists; inspect it before continuing.");
          const existingTag = optional("repos/" + REPO + "/git/ref/tags/" + TAG);
          if (existingTag) {
            assert.equal(existingTag.object.type, "commit", "Existing annotated tag needs manual inspection.");
            assert.equal(existingTag.object.sha, SOURCE, "Existing tag points to another commit.");
          } else {
            const created = api("repos/" + REPO + "/git/refs", {ref:"refs/tags/" + TAG, sha:SOURCE});
            assert.equal(created.object.sha, SOURCE);
          }
          execFileSync("gh", ["release", "create", TAG, "--repo", REPO, "--draft", "--verify-tag", "--target", SOURCE,
            "--title", "v1.1.3 · Reliable reports and cross-platform installs",
            "--notes-file", path.join(directory, "RELEASE_NOTES.md"),
            ...names.map(name => path.join(directory, name))], {stdio:"inherit"});
          let release = api("repos/" + REPO + "/releases/tags/" + TAG);
          assert.equal(release.draft, true);
          assert.equal(release.prerelease, false);
          assert.equal(release.tag_name, TAG);
          assert.deepEqual(release.assets.map(item => item.name).sort(), names.sort());
          for (const file of expected) {
            const matches = release.assets.filter(item => item.name === file.name);
            assert.equal(matches.length, 1);
            const asset = matches[0];
            assert.equal(asset.state, "uploaded");
            assert.equal(asset.size, file.bytes);
            const bytes = execFileSync("gh", ["api", "repos/" + REPO + "/releases/assets/" + asset.id, "-H", "Accept: application/octet-stream"], {maxBuffer:32*1024*1024});
            assert.equal(bytes.length, file.bytes);
            assert.equal(sha256(bytes), file.sha256);
            if (asset.digest) assert.equal(asset.digest, "sha256:" + file.sha256);
            console.log("Verified uploaded draft asset: " + file.name);
          }
          execFileSync("gh", ["release", "edit", TAG, "--repo", REPO, "--draft=false", "--latest"], {stdio:"inherit"});
          release = api("repos/" + REPO + "/releases/tags/" + TAG);
          assert.equal(release.draft, false);
          assert.equal(release.prerelease, false);
          assert.equal(api("repos/" + REPO + "/git/ref/tags/" + TAG).object.sha, SOURCE);
          assert.equal(api("repos/" + REPO + "/releases/latest").id, release.id);
          fs.writeFileSync("published-release.json", JSON.stringify({id:release.id, tag:TAG, source_sha:SOURCE, url:release.html_url, assets:expected}, null, 2) + "\n");
          console.log("Published verified release: " + release.html_url);
          
          NODE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: published-native-release-v1.1.3
          path: published-release.json
          if-no-files-found: error
