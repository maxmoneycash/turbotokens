name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: turbotokens-macos-arm64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: turbotokens-macos-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: turbotokens-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: turbotokens-linux-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: turbotokens-windows-x64.zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: turbotokens-windows-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release binary
        run: cargo build --release --bin turbotokens --features fetch-litellm-pricing --target ${{ matrix.target }}
        working-directory: rust

      - name: Verify binary runs
        if: runner.os != 'Windows'
        run: ./rust/target/${{ matrix.target }}/release/turbotokens --version

      - name: Verify binary runs (Windows)
        if: runner.os == 'Windows'
        run: ./rust/target/${{ matrix.target }}/release/turbotokens.exe --version

      - name: Package tarball
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "rust/target/${{ matrix.target }}/release/turbotokens" dist/turbotokens
          cp README.md LICENSE dist/
          tar -C dist -czf "${{ matrix.asset }}" turbotokens README.md LICENSE

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir -p dist
          cp "rust/target/${{ matrix.target }}/release/turbotokens.exe" dist/turbotokens.exe
          cp README.md, LICENSE dist/
          Compress-Archive -Path dist/turbotokens.exe, dist/README.md, dist/LICENSE -DestinationPath "${{ matrix.asset }}"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
